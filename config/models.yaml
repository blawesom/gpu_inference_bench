# gpu_inference_bench — model matrix + per-model optimization configs
#
# Consumed by container/run_matrix.py. All flags below are verified against
# vLLM v0.28.0 (spike, 2026-09-02, ROCm 7.2.3 target).
#
# Conventions:
#   - config `flags:` map to vLLM CLI args: key `kv-cache-dtype: fp8`
#     becomes `--kv-cache-dtype fp8`. A `true` value becomes a bare `--flag`.
#   - a config flag can override a model default (e.g. long-context overrides
#     max-model-len).
#   - `max_model_len` here is the BASE context length for baseline / kv-fp8;
#     the long-context config overrides it to 32768.

# ── Workload (identical across all models + vendors for comparability) ──────
workload:
  dataset: random
  random_input_len: 512
  random_output_len: 256
  num_prompts: 50
  num_warmups: 2
  concurrency_levels: [1, 4, 8, 16]
  seed: 42
  temperature: 0.0
  ignore_eos: true
  # v0.28.0 bench-serve backend (openai-chat REQUIRES the chat/completions
  # endpoint; the v0.28 default --endpoint /v1/completions is rejected).
  backend: openai-chat
  endpoint: /v1/chat/completions
  percentile_metrics: "ttft,tpot,itl"
  metric_percentiles: "50,90,99"

# ── Common server settings (applied to every cell) ──────────────────────────
common_server:
  host: 0.0.0.0
  port: 8000
  gpu_memory_utilization: 0.90
  # Pin max concurrent sequences to the workload ceiling (C=16). Required
  # for the hybrid Mamba/GDN models: vLLM v0.28 refuses to start when
  # max_num_seqs (default 256) exceeds the Mamba cache block count — M4 on a
  # 32 GB card boots with only 21 blocks ("ValueError: max_num_seqs (256)
  # exceeds available Mamba cache blocks (21)"). M3 gets the same protection
  # and smaller CUDA-graph captures. Pure-attention M1/M2 are unaffected
  # (the workload never exceeds 16 in-flight sequences).
  max_num_seqs: 16
  trust_remote_code: true
  # NOTE: --enable-prefix-caching is intentionally OFF (distorts synthetic
  # token throughput). Do not enable.

# ── Per-model optimization configs ──────────────────────────────────────────
configs:
  baseline:
    flags: {}
  kv-fp8:
    flags:
      kv-cache-dtype: fp8
  long-context:
    flags:
      max-model-len: 32768

# ── Model matrix (all must fit the 32 GB floor) ─────────────────────────────
models:
  M1:
    id: Qwen/Qwen3.5-9B
    class: dense-9b
    format: bf16
    weights_gb: 19.3
    max_model_len: 8192
    configs: [baseline, kv-fp8, long-context]

  M2:
    id: openai/gpt-oss-20b
    class: moe-small
    format: mxfp4
    weights_gb: 13.8
    max_model_len: 8192
    # No speculative decoding: MTP unsupported for GptOssForCausalLM in
    # v0.28.0 (verified in spike); ngram not a meaningful axis on random data.
    configs: [baseline, kv-fp8]

  M3:
    id: cyankiwi/Qwen3.8-27B-AWQ-INT4
    class: dense-27b
    # format is compressed-tensors pack-quantized int4 (AWQ-style observer).
    format: awq4
    weights_gb: 21.0
    # 32 GB fit (heaviest dense model). The workload needs only 512+256=768
    # tokens, so the 8192 default context wastes CUDA-graph + profiling + KV
    # budget and OOMs at the common 0.90 utilization. These model-level
    # overrides claw back headroom: 0.95 util (+~1.6 GB), 2048 context, and a
    # capped prefill/profiling batch. long-context (32k) is removed — a
    # 21 GB model cannot hold 32k context on 32 GB.
    #
    # Live probe (RX 9070 XT, 31.86 GiB, 0.95 util): model load 20.14 GiB,
    # then CUDA-graph capture OOMed 784 MiB short of the 30.22 GiB budget
    # with 816 MiB reserved-but-unallocated (fragmentation). Two fixes:
    # bench.sh sets PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True to
    # recover that pool, and common_server max_num_seqs: 16 shrinks the
    # graph captures (sized for 256 sequences by default). Round-2 escape
    # hatch if the probe still OOMs: add `enforce-eager: true` below
    # (skips CUDA-graph capture entirely).
    gpu_memory_utilization: 0.95
    max_model_len: 2048
    flags:
      max-num-batched-tokens: 2048
    configs: [baseline, kv-fp8]

  M4:
    # GPTQ-Int4 (Qwen/Qwen3.5-35B-A3B-GPTQ-Int4) is NOT supported by the
    # vLLM ROCm backend — the server fails to start ("not supported" while
    # loading attention/expert weights) on both baseline and kv-fp8. The
    # same base model in AWQ-Int4 (compressed-tensors, same quant family as
    # M3) loads on ROCm, so it is the default here. On NVIDIA, re-enable the
    # GPTQ id below to keep the official cross-vendor checkpoint.
    id: cyankiwi/Qwen3.5-35B-A3B-AWQ-4bit
    # id: Qwen/Qwen3.5-35B-A3B-GPTQ-Int4   # NVIDIA-only (GPTQ unsupported on ROCm)
    class: moe-35b-a3b
    format: awq4
    weights_gb: 24.5
    # 32 GB fit (largest weights in the matrix). Same levers as M3: 0.95
    # util, 2048 context, capped batch. 24.5 GB leaves little room, so this
    # is the tightest cell — run ./bench.sh --validate first.
    #
    # Live probe root cause (RX 9070 XT): NOT an OOM — vLLM v0.28 hybrid
    # (Mamba/GDN) startup check: "ValueError: max_num_seqs (256) exceeds
    # available Mamba cache blocks (21)." Each concurrent sequence needs one
    # Mamba state slot; the tight pool only yields 21. Fixed by
    # common_server max_num_seqs: 16 (= workload ceiling).
    gpu_memory_utilization: 0.95
    max_model_len: 2048
    flags:
      max-num-batched-tokens: 2048
    # No speculative decoding (no MTP head in config; ngram not meaningful).
    # Escape hatch if the probe OOMs: add `enforce-eager: true` below —
    # skips CUDA-graph capture entirely (saves the ~3–5 GiB graph estimate)
    # at a decode-perf cost. 35 B on a 32 GB card is the tightest cell in
    # the matrix; if it still does not fit, the honest answer is "M4 needs
    # a 40+ GB card" and it should be dropped from the 32 GB fleet.
    configs: [baseline, kv-fp8]